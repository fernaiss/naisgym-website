<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Referrer-Policy" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none';" />
  <title>Resultado del pago · NaisGym</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f5f7;min-height:100vh;display:grid;place-items:center;padding:24px;color:#151515}.card{width:min(480px,100%);background:#fff;border-radius:24px;padding:32px;text-align:center;box-shadow:0 16px 50px #0001}.icon{font-size:52px}.logo{font-size:28px;font-weight:900;margin-top:8px}h1{font-size:24px;margin:18px 0 8px}p{color:#555;line-height:1.5}.btn{display:inline-block;margin-top:18px;background:#111;color:white;text-decoration:none;padding:14px 22px;border-radius:14px;font-weight:800}.small{font-size:12px;color:#888;margin-top:16px}
  </style>
</head>
<body>
  <main class="card">
    <div id="icon" class="icon">⏳</div>
    <div class="logo">NaisGym</div>
    <h1 id="title">Procesando pago</h1>
    <p id="body">Estamos confirmando el resultado.</p>
    <a id="back" class="btn" href="com.naisgym.app://premium-payment?status=error">Volver a NaisGym</a>
    <p class="small">Si la app no se abre automáticamente, vuelve manualmente a NaisGym y toca “Actualizar estado”.</p>
  </main>
<script>
(function(){
  const raw=new URLSearchParams(location.search).get('status');
  const status=['success','cancelled','error'].includes(raw)?raw:'error';
  const data={
    success:{icon:'✅',title:'¡Premium activado!',body:'Tu pago fue aprobado y NaisGym Premium ya está activo en tu cuenta.'},
    cancelled:{icon:'↩️',title:'Pago cancelado',body:'No se realizó ningún cobro. Puedes volver a intentarlo cuando quieras.'},
    error:{icon:'⚠️',title:'No pudimos confirmar el pago',body:'No activamos Premium porque el pago no pudo ser confirmado.'}
  }[status];
  const deep='com.naisgym.app://premium-payment?status='+status;
  document.getElementById('icon').textContent=data.icon;
  document.getElementById('title').textContent=data.title;
  document.getElementById('body').textContent=data.body;
  document.getElementById('back').href=deep;
  if(status==='success') setTimeout(()=>{location.href=deep},900);
})();
</script>
</body>
</html>
