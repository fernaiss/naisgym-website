<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Referrer-Policy" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://jbigthoxpkjzjdkmxsye.supabase.co; form-action https://webpay3gint.transbank.cl https://webpay3g.transbank.cl; base-uri 'none';" />
  <title>Conectando con Webpay · NaisGym</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f5f7;color:#151515;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:white;border-radius:24px;padding:30px;box-shadow:0 16px 50px #0001;text-align:center}.logo{font-size:34px;font-weight:900;margin-bottom:8px}.spinner{width:38px;height:38px;border:4px solid #ddd;border-top-color:#111;border-radius:50%;margin:24px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{border:0;background:#111;color:white;border-radius:14px;padding:14px 22px;font-weight:800;font-size:16px;cursor:pointer}p{line-height:1.5;color:#555}.error{color:#9b1c1c}.hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">NaisGym</div>
    <p id="message">Preparando tu pago seguro con Webpay…</p>
    <div id="spinner" class="spinner"></div>
    <button id="retry" class="hidden" type="button">Volver a intentar</button>
    <form id="webpay" method="POST" class="hidden"></form>
  </main>
<script>
(function(){
  const ENDPOINT='https://jbigthoxpkjzjdkmxsye.supabase.co/functions/v1/webpay-checkout';
  const message=document.getElementById('message');
  const spinner=document.getElementById('spinner');
  const retry=document.getElementById('retry');
  const form=document.getElementById('webpay');

  function fail(text){
    spinner.classList.add('hidden');
    message.textContent=text || 'No pudimos abrir Webpay. Vuelve a NaisGym e inténtalo nuevamente.';
    message.classList.add('error');
    retry.classList.remove('hidden');
  }

  async function start(){
    retry.classList.add('hidden');
    spinner.classList.remove('hidden');
    message.classList.remove('error');
    message.textContent='Preparando tu pago seguro con Webpay…';

    const checkout=new URLSearchParams(location.search).get('checkout') || '';
    if(!/^[0-9a-f]{64}$/i.test(checkout)) return fail('Este enlace de pago no es válido.');

    try{
      const response=await fetch(ENDPOINT+'?checkout='+encodeURIComponent(checkout),{headers:{Accept:'application/json'},cache:'no-store'});
      const data=await response.json().catch(()=>({}));
      if(!response.ok || !data.action || !data.token) throw new Error(data.error || 'No pudimos preparar Webpay.');

      const amount=Number(data.amount || 0).toLocaleString('es-CL');
      message.innerHTML='Serás enviado a Webpay para pagar <strong>$'+amount+'</strong> de forma segura.';
      form.action=data.action;
      form.innerHTML='';
      const token=document.createElement('input');
      token.type='hidden'; token.name='token_ws'; token.value=data.token;
      form.appendChild(token);
      setTimeout(()=>form.submit(),350);
    }catch(e){
      fail(e && e.message ? e.message : 'No pudimos abrir Webpay.');
    }
  }

  retry.addEventListener('click',start);
  start();
})();
</script>
</body>
</html>
